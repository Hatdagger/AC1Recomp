format_version = 5
id = "acrecomp.moa.frame-rate"
version = "1.0.0"
name = "Master of Arena: In-Between Frames (test)"
author = "AC1Recomp"
description = "Test build of true in-between frames. Between the game's own frames (about 22 a second), the scene is redrawn with the game's own drawing code and the camera placed part of the way to its next position. This first test covers split-screen VS only and moves only the camera: ACs, shots and effects still move at the game's own rate. Nothing in the game's state changes; the extra pictures are only shown. Off during online play."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01030"

[[target]]
game_id = "SLUS-01081"

[[feature]]
id = "frame-rate"
name = "In-between frames (VS camera test)"
description = "Redraws split-screen VS fights between the game's frames with a smoothly moving camera. Needs the OpenGL renderer."
group = "Visual"
default_enabled = false

[[option]]
feature = "frame-rate"
id = "rate"
label = "Frame rate"
description = "How many pictures a second to show. Display follows the monitor's refresh rate."
group = "Visual"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh rate"

[[option.choice]]
value = "60"
label = "60"

[[option.choice]]
value = "120"
label = "120"

[[plugin]]
feature = "frame-rate"
id = "moa.frame-rate"
